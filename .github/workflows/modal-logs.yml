name: modal logs

# Prints the studio's recent logs from Modal. Run it from the Actions tab when
# the hosted studio misbehaves.
on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - run: pip install modal
      - run: modal app list
      - run: timeout 120 modal app logs clipagent || true
