<!doctype html>
<html lang="en" class="js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio · clipagent</title>
  <meta name="description" content="The clipagent studio: turn long videos into captioned, speaker-tracked 9:16 clips.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="studio">
  <div class="noise-overlay" aria-hidden="true"></div>
  <div class="studio-glow" aria-hidden="true"></div>

  <header>
    <nav id="main-nav" class="site-nav studio-nav" aria-label="Studio">
      <div class="container wide nav-inner">
        <a href="/" class="logo font-serif" aria-label="clipagent home">clipagent<span class="dot">.</span></a>
        <div id="status-chips" class="chips"></div>
        <button class="pill pill-white" id="new-project-btn" type="button">+ New project</button>
      </div>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Projects">
      <h3>Projects</h3>
      <ul id="job-list" class="job-list"></ul>
    </aside>

    <main id="main" class="studio-main"></main>
  </div>

  <!-- New project -->
  <template id="tpl-new">
    <section class="panel narrow">
      <h1 class="font-serif studio-title">Make clips from<br><span class="italic">a long video.</span></h1>
      <p class="studio-sub">Drop a podcast, interview or stream. The agent finds the moments, frames the speaker and adds captions.</p>
      <p class="public-note" id="public-note" hidden></p>
      <form id="new-form">
        <label class="drop" id="drop">
          <input type="file" name="file" accept="video/*,audio/*" hidden>
          <span class="drop-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
          <strong>Drop a video here</strong> or click to choose a file
          <span class="filename"></span>
        </label>
        <div class="or">or</div>
        <input class="input" name="url" type="url" placeholder="Paste a YouTube, Vimeo, X or Twitch link">

        <details class="options" open>
          <summary>Options</summary>
          <div class="grid">
            <label>Clips <input class="input" type="number" name="num_clips" min="1" max="30"></label>
            <label>Min length (s) <input class="input" type="number" name="min_duration" min="5" max="170"></label>
            <label>Max length (s) <input class="input" type="number" name="max_duration" min="10" max="180"></label>
            <label>Layout
              <select class="input" name="layout">
                <option value="auto">Auto</option>
                <option value="crop">Follow speaker</option>
                <option value="split">Split screen</option>
                <option value="blur">Full frame + blur</option>
              </select>
            </label>
            <label>Transcription
              <select class="input" name="whisper_model">
                <option value="base">Fast (base)</option>
                <option value="small">Balanced (small)</option>
                <option value="medium">Accurate (medium)</option>
                <option value="large-v3">Best (large-v3)</option>
              </select>
            </label>
            <label>Highlight colour <input class="input" type="color" name="caption_highlight"></label>
          </div>
          <div class="toggles">
            <label><input type="checkbox" name="use_llm"> AI picks highlights</label>
            <label><input type="checkbox" name="captions"> Captions</label>
            <label><input type="checkbox" name="show_title"> Hook title</label>
            <label><input type="checkbox" name="emoji"> Emoji</label>
            <label><input type="checkbox" name="broll"> B-roll</label>
            <label><input type="checkbox" name="speaker_detection"> Speaker detection</label>
          </div>
        </details>
        <p class="error" id="new-error"></p>
        <button class="pill pill-white pill-lg" type="submit">Find clips</button>
      </form>
    </section>
  </template>

  <!-- Editor dialog -->
  <dialog id="editor" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h2 class="font-serif">Edit <span class="italic">clip</span></h2>
      <button class="icon-btn" value="close" aria-label="Close">✕</button>
    </form>
    <div class="editor">
      <div class="editor-left">
        <video id="ed-source" controls preload="metadata"></video>
        <div class="range-row">
          <label>Start <input class="input" id="ed-start" type="number" step="0.1"></label>
          <button class="pill pill-ghost pill-sm" id="ed-set-start" type="button">Set to playhead</button>
          <label>End <input class="input" id="ed-end" type="number" step="0.1"></label>
          <button class="pill pill-ghost pill-sm" id="ed-set-end" type="button">Set to playhead</button>
          <button class="pill pill-ghost pill-sm" id="ed-preview" type="button">▶ Preview</button>
          <span id="ed-length" class="muted"></span>
        </div>
        <p class="muted small">Click a word to jump there. Shift-click to set the clip's start/end to that word.</p>
        <div id="ed-transcript" class="transcript"></div>
      </div>
      <div class="editor-right">
        <label>Title <input class="input" id="ed-title" maxlength="100"></label>
        <label>Description <textarea class="input" id="ed-description" rows="3"></textarea></label>
        <label>Hashtags <input class="input" id="ed-hashtags" placeholder="comma separated"></label>
        <label>Layout
          <select class="input" id="ed-layout">
            <option value="">Project default</option>
            <option value="auto">Auto</option>
            <option value="crop">Follow speaker</option>
            <option value="split">Split screen</option>
            <option value="blur">Full frame + blur</option>
          </select>
        </label>
        <label>Highlight colour <input class="input" type="color" id="ed-highlight"></label>
        <div class="toggles col">
          <label><input type="checkbox" id="ed-captions"> Captions</label>
          <label><input type="checkbox" id="ed-show_title"> Hook title</label>
          <label><input type="checkbox" id="ed-emoji"> Emoji</label>
          <label><input type="checkbox" id="ed-broll"> B-roll</label>
        </div>
        <p class="error" id="ed-error"></p>
        <div class="row">
          <button class="pill pill-white" id="ed-save" type="button">Save &amp; re-render</button>
          <button class="pill pill-ghost" id="ed-save-new" type="button">Save as new clip</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Login -->
  <dialog id="login" class="dialog">
    <form id="login-form" class="dialog-body">
      <h2 class="font-serif">Welcome <span class="italic">back</span></h2>
      <input class="input" type="password" name="password" autofocus>
      <p class="error" id="login-error"></p>
      <button class="pill pill-white">Sign in</button>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
