[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipagent"
version = "0.1.0"
description = "AI clipping agent: long videos in, captioned 9:16 viral clips out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "faster-whisper>=1.0",
  "anthropic>=0.80",
  "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipagent = "clipagent.cli:main"

[tool.setuptools.packages.find]
include = ["clipagent*"]
